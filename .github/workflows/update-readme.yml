name: Update README

on:
  push:
    branches: [main, master]
    paths:
      - 'Source/**'
      - 'Config/**'
      - 'DA.uproject'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:  # Allow manual trigger
  schedule:
    - cron: '0 0 * * 0'  # Weekly update on Sunday at midnight UTC

permissions:
  contents: write  # Required to commit changes

jobs:
  update-readme:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate stats
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      
      - name: Generate README content
        run: python scripts/update_readme.py
      
      - name: Check for changes
        id: check_changes
        run: |
          git diff --exit-code README.md || echo "has_changes=true" >> $GITHUB_OUTPUT
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add README.md
          git commit -m "docs: auto-update README [skip ci]"
          git push
